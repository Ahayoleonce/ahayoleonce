<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About Me – AHAYO Leonce</title>
<meta name="description" content="About AHAYO Leonce, computer engineer.">
<meta name="theme-color" content="#161618">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="shortcut icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161618;
  --card:#2b2b2e;
  --card2:#232326;
  --text:#f2f4fa;
  --muted:#8d91a0;
  --line:rgba(255,255,255,.1);
  --brand:#4d7cff;
  --brand-soft:rgba(77,124,255,.14);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden;touch-action:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:8px}
::selection{background:var(--brand-soft);color:#fff}
h1,h2,h3{margin:0;line-height:1.15;font-family:'Outfit',sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.ico{width:1.2em;height:1.2em;fill:currentColor;flex:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--text);color:var(--bg);border:0;border-radius:12px;padding:16px 32px;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover:before{transform:translateX(120%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -8px rgba(255,255,255,.2)}
.btn .ico{transition:transform .3s}.btn:hover .ico{transform:translateX(4px)}

/* reveal */
[data-r]{opacity:0;transform:translateY(30px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
[data-r].in{opacity:1;transform:none}

/* ============ TOPBAR ============ */
.top{position:fixed;z-index:60;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 32px));transition:width .5s var(--ease),top .4s,transform .4s;animation:drop .9s var(--ease) both}
@keyframes drop{from{transform:translate(-50%,-80px);opacity:0}}
.nav{position:relative;display:flex;justify-content:space-between;align-items:center;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:99px;padding:8px 10px 8px 20px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.logo{font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;letter-spacing:.1em;color:var(--text);display:inline-flex;align-items:center;padding:6px 2px;transition:opacity .3s,color .3s}
.logo:hover{opacity:.8;color:var(--brand)}
.links{position:relative;display:flex;gap:4px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.links a{position:relative;z-index:1;padding:10px 16px;border-radius:99px;transition:color .25s,background .25s}
.links a:hover{color:var(--text);background:rgba(255,255,255,.06)}
.links a.hire{background:var(--brand);color:#fff;margin-left:8px;padding:10px 20px;transition:transform .2s,box-shadow .2s,background .2s}.links a.hire:hover{transform:scale(1.03);box-shadow:0 8px 20px rgba(77,124,255,.3)}
.burger{display:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--card2);cursor:pointer;padding:0 11px 0 0;flex-direction:column;justify-content:center;align-items:flex-end;gap:5px;transition:background .3s}
.burger:hover{background:var(--line)}
.burger i{display:block;height:2px;border-radius:2px;background:var(--text);transition:transform .3s,width .3s,opacity .2s}
.burger i:nth-child(1),.burger i:nth-child(3){width:18px}.burger i:nth-child(2){width:12px}
.burger.x i:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.x i:nth-child(2){opacity:0;width:0}.burger.x i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* Transparent Mobile Menu */
@media(max-width:780px){
  .burger{display:flex}
  .links{display:flex;flex-direction:column;align-items:stretch;position:absolute;left:0;right:0;top:calc(100% + 16px);background:transparent;border:none;box-shadow:none;padding:0;gap:8px;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.98);transition:.35s var(--ease)}
  .links.open{opacity:1;visibility:visible;transform:none}
  .links a{padding:14px 20px;background:rgba(43,43,46,.85);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,.3)}
  .links a.hire{margin:8px 0 0;background:var(--brand);color:#fff;border:none}
}

/* ============ ABOUT LAYOUT ============ */
.about-hero{
  padding:180px 0 120px;
  background:var(--bg);
  position:relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
}

.about-grid{
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  grid-template-rows: auto auto auto;
  grid-template-areas: 
    "text image"
    "btn image"
    "stats image";
  gap: 0 60px;
  align-items: center;
  width: 100%;
}

.about-text { grid-area: text; align-self: end; }
.about-text h1{
  font-size:clamp(40px,6vw,72px);
  font-weight:900;
  letter-spacing:-.03em;
  line-height:1.05;
  margin-bottom:24px;
}
.about-text h1 span{
  color:transparent;
  background:linear-gradient(180deg,#fff 30%,var(--muted) 100%);
  -webkit-background-clip:text;
  background-clip:text;
}
.about-text p{
  font-size:clamp(16px,2vw,18px);
  color:var(--muted);
  line-height:1.7;
  font-weight:500;
  margin-bottom:20px;
}

.about-btn { 
  grid-area: btn; 
  justify-self: start; 
  margin-top: 24px; 
  margin-bottom: 48px; 
}

.stats-grid {
  grid-area: stats;
  align-self: start;
  display: flex;
  gap: 60px;
  border-top: 1px solid var(--line);
  padding-top: 40px;
}
.stat-item h3{
  font-size:clamp(32px,4vw,48px);
  font-weight:900;
  color:var(--text);
  margin-bottom:4px;
}
.stat-item h3 span{color:var(--brand)}
.stat-item p{
  font-size:14px;
  color:var(--muted);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
}

/* Image Container (Slideshow / Clickable) */
.about-img-col { 
  grid-area: image; 
  align-self: center;
  display: flex;
  justify-content: center;
}

.about-img-wrap{
  position:relative;
  aspect-ratio:4/5;
  width: 100%;
  max-width: 400px;
  border-radius:32px;
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  box-shadow:0 30px 60px -15px rgba(0,0,0,.6);
  animation:floatImg 6s ease-in-out infinite;
  overflow: hidden;
  cursor: default; /* Desktop: No click */
}

/* Slide Images inside */
.slide-img {
  position: absolute;
  inset: 12px; /* Match padding */
  width: calc(100% - 24px);
  height: calc(100% - 24px);
  object-fit: cover;
  border-radius: 22px;
  opacity: 0;
  transition: opacity 1s ease-in-out;
  pointer-events: none;
}
.slide-img.active {
  opacity: 1;
}

@keyframes floatImg{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.about-img-wrap:before{
  content:"";
  position:absolute;
  inset:-15px;
  border-radius:40px;
  border:1px dashed rgba(255,255,255,.15);
  z-index:-1;
  animation:spinSlow 30s linear infinite;
  pointer-events: none;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}

/* ============ MOBILE TAP OVERLAY ============ */
.tap-hint {
  display: none; /* Hidden on desktop */
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  z-index: 10;
  pointer-events: none;
  animation: pulseHint 2s infinite;
}
.tap-hint svg { width: 14px; height: 14px; fill: currentColor; margin-right: 6px; vertical-align: middle;}
@keyframes pulseHint {
  0%, 100% { transform: translate(-50%, 0); opacity: 0.8; }
  50% { transform: translate(-50%, -4px); opacity: 1; }
}

/* ============ FULLSCREEN IMAGE MODAL (MOBILE ONLY) ============ */
.img-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s;
}
.img-modal.open {
  opacity: 1;
  visibility: visible;
}
.img-modal img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  transition: opacity .3s;
}
.img-modal-close {
  position: absolute;
  top: calc(20px + env(safe-area-inset-top));
  right: 20px;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  color: #fff;
  font-size: 24px;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 1010;
}
.img-modal-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 1010;
}
.img-modal-nav.prev { left: 16px; }
.img-modal-nav.next { right: 16px; }
.img-modal-dots {
  position: absolute;
  bottom: calc(30px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}
.img-modal-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); transition: background .3s;
}
.img-modal-dots span.active { background: #fff; }

/* ============ BACK TO TOP ============ */
.back-to-top {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  right: 24px;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(43, 43, 46, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 99px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px);
  transition: opacity .4s var(--ease), transform .4s var(--ease), visibility .4s, background .2s;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
}
.back-to-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.back-to-top:hover {
  background: var(--card2);
  border-color: rgba(255,255,255,.25);
}
.back-to-top svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  animation: bounceUp 2s infinite;
}
@keyframes bounceUp {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-4px); }
  60% { transform: translateY(-2px); }
}

/* ============ OPENING SCREEN ============ */
.loader{
  position:fixed;inset:0;
  z-index:50;
  display:grid;place-items:center;
  overflow:hidden;
  background:var(--bg);
  transition:opacity .75s var(--ease),transform .75s var(--ease);
  animation:ldguard 0s 8s forwards;
}
.loader.exit{opacity:0;transform:scale(1.04);pointer-events:none}
@keyframes ldguard{to{opacity:0;visibility:hidden;pointer-events:none}}
.ld-box{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px}
.ld-img-wrap{position:relative;opacity:0;transform:translateX(-120vw) rotate(-8deg) scale(.8);animation:ldin 1.6s cubic-bezier(.16,1,.3,1) .05s forwards;will-change:transform,opacity}
@keyframes ldin{0%{opacity:0;transform:translateX(-120vw) rotate(-8deg) scale(.8)}60%{opacity:1}80%{transform:translateX(3%) rotate(1.5deg) scale(1.02)}100%{opacity:1;transform:translateX(0) rotate(0) scale(1)}}
.ld-img{display:block;width:min(320px,68vw);max-height:38vh;object-fit:contain;filter:blur(10px) drop-shadow(0 24px 48px rgba(0,0,0,.6));animation:ldclear 1.6s var(--ease) .05s forwards,ldfloat 5s ease-in-out 1.8s infinite;will-change:filter,transform}
@keyframes ldclear{to{filter:blur(0) drop-shadow(0 24px 48px rgba(0,0,0,.6))}}
@keyframes ldfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ld-dots{display:flex;gap:12px;margin-top:clamp(24px,5vh,48px);opacity:0;animation:ldfade .6s var(--ease) 1.3s forwards}
.ld-dots span{width:10px;height:10px;border-radius:50%;background:var(--brand);animation:lddot 1.2s ease-in-out infinite}
.ld-dots span:nth-child(2){background:var(--text);animation-delay:.15s}
.ld-dots span:nth-child(3){animation-delay:.3s}
@keyframes lddot{0%,100%{transform:translateY(0) scale(.6);opacity:.3}50%{transform:translateY(-12px) scale(1);opacity:1}}
@keyframes ldfade{to{opacity:1}}
@media(max-width:640px){.ld-img{width:min(260px,75vw);max-height:32vh}.ld-dots span{width:8px;height:8px}}
@media(prefers-reduced-motion:reduce){.loader{display:none!important}}

/* ============ MOBILE RESPONSIVE ============ */
@media(max-width:900px){
  .about-hero { padding:120px 0 60px; min-height: auto; }
  
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: 
      "text text"
      "btn btn"
      "stats image";
    gap: 24px;
    align-items: center;
  }
  
  .about-text {
    grid-area: text;
    text-align: center;
    align-self: auto;
  }
  .about-text h1 { font-size: clamp(32px, 8vw, 42px); margin-bottom: 16px; }
  .about-text p { font-size: 15px; margin-bottom: 16px; text-align: center; }
  
  .about-btn {
    grid-area: btn;
    justify-self: center;
    width: 100%;
    max-width: 300px;
    margin: 10px 0 20px;
    padding: 14px 24px;
    font-size: 14px;
  }
  
  .stats-grid {
    grid-area: stats;
    display: flex;
    flex-direction: column;
    gap: 24px;
    border: none;
    padding: 0;
    align-items: flex-start;
    justify-self: start;
  }
  .stat-item h3 { font-size: 42px; margin-bottom: 4px; }
  .stat-item p { font-size: 11px; line-height: 1.3; }
  
  .about-img-col {
    grid-area: image;
    display: flex;
    justify-content: flex-end;
  }
  .about-img-wrap {
    width: 100%;
    max-width: 160px;
    aspect-ratio: 1/1;
    padding: 6px;
    border-radius: 20px;
    cursor: pointer; /* Mobile: Clickable */
  }
  .slide-img { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); border-radius: 14px; }
  .about-img-wrap:before { inset: -8px; border-radius: 24px; }
  
  /* Show tap hint on mobile */
  .tap-hint { display: block; bottom: 12px; padding: 6px 12px; font-size: 10px; }

  /* Mobile Back to Top */
  .back-to-top {
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    padding: 10px 16px;
    font-size: 13px;
  }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></symbol>
<symbol id="i-zoom" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></symbol>
</defs></svg>

<!-- ============ OPENING SCREEN ============ -->
<div class="loader" id="loader" role="status" aria-label="Loading">
  <div class="ld-box">
    <div class="ld-img-wrap">
      <img class="ld-img" src="img/loading.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="ld-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- ============ TOPBAR ============ -->
<header class="top" id="top"><div class="nav" id="nav">
 <a class="logo" href="./" aria-label="AHAYO – home">AHAYO</a>
 <button class="burger" id="bg" aria-label="Open menu" aria-expanded="false"><i></i><i></i><i></i></button>
 <nav class="links" id="lk" aria-label="Main">
   <a href="./">Home</a>
   <a href="projects">Projects</a>
   <a href="skills">Skills</a>

   <a class="hire" href="contact">Hire me</a>
 </nav>
</div></header>

<!-- ============ ABOUT CONTENT ============ -->
<section class="about-hero">
  <div class="wrap">
    <div class="about-grid">
      
      <!-- Text Content -->
      <div class="about-text" data-r id="aboutTextContainer">
        <!-- Content loaded via JS -->
      </div>
      
      <!-- Button -->
      <a class="btn about-btn" href="projects" data-r style="--d:.1s">See what I've built <svg class="ico"><use href="#i-arrow"/></svg></a>
      
      <!-- Stats (Left on Mobile) -->
      <div class="stats-grid" data-r style="--d:.2s">
        <div class="stat-item">
          <h3 id="statYears">0<span>+</span></h3>
          <p>Years Coding</p>
        </div>
        <div class="stat-item">
          <h3 id="statProjects">0<span>+</span></h3>
          <p>Projects Built</p>
        </div>
      </div>
      
      <!-- Image (Right on Mobile) -->
      <div class="about-img-col" data-r style="--d:.3s">
        <div class="about-img-wrap" id="imageGallery">
          <!-- Images loaded via JS -->
          
          <!-- Mobile Tap Hint -->

            <svg><use href="#i-zoom"/></svg> Tap to view
          </div>
          
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ============ FULLSCREEN IMAGE MODAL ============ -->
<div class="img-modal" id="imgModal">
  <button class="img-modal-close" id="closeModal">&times;</button>
  <button class="img-modal-nav prev" id="prevImg">&#10094;</button>
  <img id="modalImg" src="" alt="Fullscreen view">
  <button class="img-modal-nav next" id="nextImg">&#10095;</button>
  <div class="img-modal-dots" id="modalDots"></div>
</div>

<!-- ============ BACK TO TOP ============ -->
<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <svg><use href="#i-up"/></svg>
  <span>Top</span>
</button>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const isMobile = window.matchMedia('(max-width: 900px)').matches;

/* ============ OPENING SCREEN ============ */
(()=>{
  const L=$('#loader');if(!L)return;
  if(rm){L.remove();return;}
  const MIN=2000,CAP=4200,t0=performance.now();
  let done=false,pageReady=document.readyState==='complete';
  document.documentElement.classList.add('ld-on');
  document.body.classList.add('lock');

  function finish(){
    if(done)return;done=true;
    setTimeout(()=>{
      L.classList.add('exit');
      document.body.classList.remove('lock');
      document.documentElement.classList.remove('ld-on');
      setTimeout(()=>{L.remove()},800);
    },250);
  }

  addEventListener('load',()=>{pageReady=true},{once:true});
  (function wait(){
    if(done)return;
    const el=performance.now()-t0;
    if(el>=MIN&&pageReady)finish();
    else if(el>CAP)finish();
    else setTimeout(wait,120);
  })();

  const skip=()=>finish();
  L.addEventListener('click',skip,{passive:true});
  addEventListener('keydown',skip,{once:true});
  addEventListener('wheel',skip,{once:true,passive:true});

/* ============ LOAD ABOUT DATA FROM JSON ============ */
async function loadAboutData() {
  try {
    const response = await fetch('assets/about.json');
    if (!response.ok) throw new Error('Network response was not ok');
    const data = await response.json();

    // 1. Populate Text
    const textContainer = document.getElementById('aboutTextContainer');
    textContainer.innerHTML = `<h1>${data.heading}</h1>` + 
      data.paragraphs.map(p => `<p>${p}</p>`).join('');

    // 2. Populate Stats
    const currentYear = new Date().getFullYear();
    const yearsCoding = currentYear - data.startYearCoding;
    document.getElementById('statYears').innerHTML = `${yearsCoding}<span>+</span>`;
    document.getElementById('statProjects').innerHTML = `${data.projectsBuilt}<span>+</span>`;

    // 3. Populate Images
    const gallery = document.getElementById('imageGallery');
    const hint = gallery.querySelector('.tap-hint');
    
    // Remove old images if any
    gallery.querySelectorAll('.slide-img').forEach(img => img.remove());

    // Add new images before the hint
    data.images.forEach((imgName, i) => {
      const img = document.createElement('img');
      img.className = `slide-img ${i === 0 ? 'active' : ''}`;
      img.src = `img/${imgName}`;
      img.alt = `AHAYO Leonce Image ${i+1}`;
      img.onerror = function() { this.src = 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=800&auto=format&fit=crop'; };
      gallery.insertBefore(img, hint);
    });

    // 4. Initialize Slideshow & Modal
    initGallery();

  } catch (error) {
    console.error('Error loading about data:', error);
    // Fallback text
    document.getElementById('aboutTextContainer').innerHTML = `<h1>I turn ideas into <span>working systems.</span></h1><p>I'm AHAYO Leonce, a computer engineer. I build systems that solve real problems.</p>`;
  }
}

/* ============ IMAGE SLIDESHOW & MODAL LOGIC ============ */
function initGallery() {
  const images = $$('#imageGallery .slide-img');
  const gallery = $('#imageGallery');
  const modal = $('#imgModal');
  const modalImg = $('#modalImg');
  const closeBtn = $('#closeModal');
  const prevBtn = $('#prevImg');
  const nextBtn = $('#nextImg');
  const dotsContainer = $('#modalDots');
  
  let currentIndex = 0;
  let slideInterval;

  // 1. DESKTOP SLIDESHOW (Auto every 3s)
  function startSlideshow() {
    if (isMobile || images.length <= 1) return; 
    clearInterval(slideInterval);
    slideInterval = setInterval(() => {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active');
    }, 3000);
  }
  startSlideshow();

  // 2. MOBILE MODAL LOGIC
  // Build dots
  dotsContainer.innerHTML = '';
  images.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    dotsContainer.appendChild(dot);
  });
  const dots = $$('#modalDots span');

  function updateModalImage(index) {
    if (index < 0) index = images.length - 1;
    if (index >= images.length) index = 0;
    
    currentIndex = index;
    modalImg.src = images[currentIndex].src;
    
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === currentIndex);
    });
  }

  // Open Modal on Mobile Tap
  gallery.addEventListener('click', () => {
    if (!isMobile || images.length === 0) return;
    updateModalImage(0);
    modal.classList.add('open');
    document.body.classList.add('lock');
  });

  // Close Modal
  function closeModal() {
    modal.classList.remove('open');
    document.body.classList.remove('lock');
  }
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Modal Navigation
  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    updateModalImage(currentIndex - 1);
  });
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    updateModalImage(currentIndex + 1);
  });

  // Add Touch Swipe logic for mobile modal
  let touchStartX = 0;
  let touchEndX = 0;
  
  modal.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, {passive: true});

  modal.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, {passive: true});

  function handleSwipe() {
    const swipeThreshold = 50;
    if (touchEndX < touchStartX - swipeThreshold) {
      updateModalImage(currentIndex + 1);
    }
    if (touchEndX > touchStartX + swipeThreshold) {
      updateModalImage(currentIndex - 1);
    }
  }
}

/* ============ BACK TO TOP LOGIC ============ */
const backToTopBtn = $('#backToTop');

window.addEventListener('scroll', () => {
  if (window.scrollY > 300) {
    backToTopBtn.classList.add('show');
  } else {
    backToTopBtn.classList.remove('show');
  }
}, { passive: true });

backToTopBtn.addEventListener('click', () => {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});

// Start the data loading process
document.addEventListener('DOMContentLoaded', loadAboutData);
</script>
